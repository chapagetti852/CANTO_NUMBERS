<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b1a" />
    <title>Canto Numbers</title>
    <style>
      /* Self-hosted (OFL). Silkscreen for titles/numbers; it lacks ā and ń, so Yale uses Pixelify Sans. */
      @font-face { font-family: 'Silkscreen'; font-weight: 400; font-display: block; src: url('assets/fonts/silkscreen-400.woff2') format('woff2'); }
      @font-face { font-family: 'Silkscreen'; font-weight: 700; font-display: block; src: url('assets/fonts/silkscreen-700.woff2') format('woff2'); }
      @font-face {
        font-family: 'Pixelify Sans'; font-weight: 400 700; font-display: block;
        src: url('assets/fonts/pixelify-700-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Pixelify Sans'; font-weight: 400 700; font-display: block;
        src: url('assets/fonts/pixelify-700-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Chinese pixel font for popup phrases. Until a pixel font is added, the system CJK font is used.
         To add one: put it at public/assets/fonts/pixel-zh.woff2 and add
         url('assets/fonts/pixel-zh.woff2') format('woff2') to the front of src. */
      @font-face {
        font-family: 'PixelZh';
        src: local('PingFang HK'), local('Noto Sans TC');
        font-display: block;
      }
      :root {
        --bg: #0b0b1a;
        --ink: #f4f4ff;
        --hot: #ff2e88;
        --cyan: #22e6ff;
        --lime: #b6ff3b;
        --yellow: #ffd60a;
        --panel: #1a1840;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Silkscreen', monospace;
        overflow: hidden;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 560px;
        margin: 0 auto;
      }
      #game-container { flex: 1; min-height: 0; }
      #answer-bar {
        display: none;
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
        background: var(--panel);
        border-top: 4px solid var(--hot);
      }
      #answer-bar.on { display: block; }
      .row { display: flex; gap: 6px; }
      .row + .row { margin-top: 6px; }
      #answer {
        flex: 1;
        min-width: 0;
        font: 700 22px 'Pixelify Sans', monospace;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--bg);
        border: 3px solid var(--cyan);
        padding: 8px 10px;
        outline: none;
        border-radius: 0;
      }
      #answer:focus { border-color: var(--lime); }
      button {
        font: 700 16px 'Silkscreen', monospace;
        color: var(--bg);
        background: var(--yellow);
        border: 0;
        box-shadow: inset -3px -3px 0 rgba(0,0,0,.35);
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 0;
      }
      button:active { transform: translateY(2px); box-shadow: none; }
      #go { background: var(--lime); }
      #replay { background: var(--cyan); }
      #tones button {
        flex: 1;
        padding: 8px 0;
        background: var(--hot);
        color: var(--ink);
        font: 700 17px 'Pixelify Sans', monospace;
        line-height: 1;
      }
      #tones button small { display: block; font: 400 9px 'Silkscreen', monospace; opacity: .8; margin-top: 3px; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
      <div id="answer-bar">
        <div class="row" id="tones">
          <button data-tone="1">ā<small>1</small></button>
          <button data-tone="2">á<small>2</small></button>
          <button data-tone="3">a<small>3</small></button>
          <button data-tone="4">àh<small>4</small></button>
          <button data-tone="5">áh<small>5</small></button>
          <button data-tone="6">ah<small>6</small></button>
        </div>
        <div class="row">
          <button id="replay" aria-label="Replay audio">▶</button>
          <input id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" />
          <button id="go">GO</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
