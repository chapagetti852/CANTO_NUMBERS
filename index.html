<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14060a" />
    <title>Canto Numbers</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      /* Self-hosted (OFL). Silkscreen for titles/numbers; it lacks ā and ń, so Yale uses VT323 (below). */
      @font-face { font-family: 'Silkscreen'; font-weight: 400; font-display: block; src: url('assets/fonts/silkscreen-400.woff2') format('woff2'); }
      @font-face { font-family: 'Silkscreen'; font-weight: 700; font-display: block; src: url('assets/fonts/silkscreen-700.woff2') format('woff2'); }
      /* VT323: a pixel terminal font that stays legible at input size, with every Yale tone mark. */
      @font-face {
        font-family: 'VT323'; font-display: block;
        src: url('assets/fonts/vt323-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'VT323'; font-display: block;
        src: url('assets/fonts/vt323-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Chinese pixel font for popup phrases. Until a pixel font is added, the system CJK font is used.
         To add one: put it at public/assets/fonts/pixel-zh.woff2 and add
         url('assets/fonts/pixel-zh.woff2') format('woff2') to the front of src. */
      @font-face {
        font-family: 'PixelZh';
        src: local('PingFang HK'), local('Noto Sans TC');
        font-display: block;
      }
      :root {
        /* Hong Kong flag red + bauhinia white, neon gold, bauhinia-flower pink. */
        --bg: #14060a;
        --panel: #2b0b12;
        --ink: #fff4ef;
        --red: #e8112d;
        --rose: #ff6b93;
        --gold: #ffc23d;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Silkscreen', monospace;
        overflow: hidden;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 560px;
        margin: 0 auto;
      }
      #game-container { flex: 1; min-height: 0; position: relative; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #b0848a; font: 28px 'VT323', monospace; }
      #answer-bar {
        display: none;
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
        background: var(--panel);
        border-top: 4px solid var(--red);
      }
      #answer-bar.on { display: block; }
      .row { display: flex; gap: 6px; }
      .row + .row { margin-top: 6px; }
      #answer {
        flex: 1;
        min-width: 0;
        font: 32px 'VT323', monospace;
        line-height: 1;
        color: var(--ink);
        background: var(--bg);
        border: 3px solid var(--rose);
        padding: 4px 10px;
        outline: none;
        border-radius: 0;
      }
      #answer:focus { border-color: var(--gold); }
      #answer::placeholder { color: #6e4a50; }
      button {
        font: 700 16px 'Silkscreen', monospace;
        color: var(--bg);
        background: var(--gold);
        border: 0;
        box-shadow: inset -3px -3px 0 rgba(0,0,0,.35);
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 0;
      }
      button:active { transform: translateY(2px); box-shadow: none; }
      #go { background: var(--gold); }
      #replay { background: var(--rose); }
      #tones button {
        flex: 1;
        padding: 8px 0;
        background: var(--red);
        color: var(--ink);
        font: 28px 'VT323', monospace;
        line-height: 1;
      }
      #tiles {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 5px;
        margin-top: 6px;
      }
      #tiles button {
        padding: 6px 0;
        background: #4a1520;
        color: var(--ink);
        font: 24px 'VT323', monospace;
        line-height: 1;
        box-shadow: inset -3px -3px 0 rgba(0,0,0,.35);
      }
      #tiles button[data-back] { grid-column: span 4; background: #6e2030; }
      #tones { margin-top: 6px; }
      .pad { display: grid; gap: 5px; margin-top: 6px; }
      .pad button {
        padding: 8px 0;
        background: #4a1520;
        color: var(--ink);
        font: 28px 'VT323', monospace;
        line-height: 1;
        box-shadow: inset -3px -3px 0 rgba(0,0,0,.35);
      }
      .pad button[data-back] { background: #6e2030; }
      #digits { grid-template-columns: repeat(4, 1fr); }
      #digits .wide { grid-column: span 4; }
      #letters { grid-template-columns: repeat(7, 1fr); }
      #letters button { font-size: 24px; padding: 6px 0; }
      #hint {
        margin-top: 6px;
        font: 18px 'VT323', monospace;
        color: #b0848a;
        text-align: center;
        min-height: 18px;
      }
      #answer[readonly] { caret-color: transparent; }
      #tones button small { display: block; font: 400 9px 'Silkscreen', monospace; opacity: .8; margin-top: 3px; }
      #name-bar {
        display: none;
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
        background: var(--panel);
        border-top: 4px solid var(--gold);
      }
      #name-bar.on { display: block; }
      #name {
        flex: 1;
        min-width: 0;
        font: 32px 'VT323', monospace;
        line-height: 1;
        color: var(--ink);
        background: var(--bg);
        border: 3px solid var(--rose);
        padding: 4px 10px;
        outline: none;
        border-radius: 0;
      }
      #name:focus { border-color: var(--gold); }
      #name::placeholder { color: #6e4a50; }
      /* Phones: the fields only display what the in-app keys type; tapping them does nothing. */
      @media (pointer: coarse) { #answer, #name { pointer-events: none; user-select: none; } }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-container"><div id="loading">loading…</div></div>
      <div id="answer-bar">
        <div class="row">
          <button id="replay" aria-label="Replay audio">▶</button>
          <input id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" />
          <button id="go">GO</button>
        </div>
        <!-- Syllable tiles: every answer in the game is built from these. Tap one, then a tone. -->
        <div id="tiles">
          <button data-syl="yat">yat</button><button data-syl="yi">yi</button><button data-syl="leung">leung</button><button data-syl="saam">saam</button><button data-syl="sei">sei</button><button data-syl="ng">ng</button>
          <button data-syl="luk">luk</button><button data-syl="chat">chat</button><button data-syl="baat">baat</button><button data-syl="gau">gau</button><button data-syl="sap">sap</button><button data-syl="ling">ling</button>
          <button data-syl="baak">baak</button><button data-syl="chin">chin</button><button data-syl="maan">maan</button><button data-syl="ya">ya</button><button data-syl="sa">sa</button><button data-syl="a">a</button>
          <button data-syl="man">man</button><button data-syl="hou">hou</button><button data-syl="go">go</button><button data-syl="bun">bun</button><button data-syl="yik">yik</button><button data-syl="dim">dim</button>
          <button data-syl="fan">fan</button><button data-syl="ji">ji</button>
          <button data-back aria-label="Delete last syllable">⌫</button>
        </div>
        <!-- Number pad for Listen mode (phones: always; PC: optional). -->
        <div id="digits" class="pad">
          <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-back aria-label="Delete">⌫</button>
          <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key=".">.</button>
          <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="%">%</button>
          <button data-key="0" class="wide">0</button>
        </div>
        <div class="row" id="tones">
          <button data-tone="1">ā<small>1</small></button>
          <button data-tone="2">á<small>2</small></button>
          <button data-tone="3">a<small>3</small></button>
          <button data-tone="4">àh<small>4</small></button>
          <button data-tone="5">áh<small>5</small></button>
          <button data-tone="6">ah<small>6</small></button>
        </div>
        <div id="hint"></div>
      </div>
      <div id="name-bar">
        <div class="row">
          <input id="name" maxlength="16" placeholder="your name" autocomplete="nickname" autocorrect="off" spellcheck="false" enterkeyhint="send" />
          <button id="post">POST</button>
        </div>
        <!-- Letter pad for the leaderboard name on phones (no system keyboard). -->
        <div id="letters" class="pad">
          <button data-key="a">a</button><button data-key="b">b</button><button data-key="c">c</button><button data-key="d">d</button><button data-key="e">e</button><button data-key="f">f</button><button data-key="g">g</button><button data-key="h">h</button><button data-key="i">i</button><button data-key="j">j</button><button data-key="k">k</button><button data-key="l">l</button><button data-key="m">m</button><button data-key="n">n</button><button data-key="o">o</button><button data-key="p">p</button><button data-key="q">q</button><button data-key="r">r</button><button data-key="s">s</button><button data-key="t">t</button><button data-key="u">u</button><button data-key="v">v</button><button data-key="w">w</button><button data-key="x">x</button><button data-key="y">y</button><button data-key="z">z</button><button data-key=" " aria-label="Space">␣</button><button data-back aria-label="Delete">⌫</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
